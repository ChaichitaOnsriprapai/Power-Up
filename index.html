<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Up!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <main>

        <section class="container mt-5 shadow p-4 rounded bg-light">
            <h1 class="text-center mb-4">Create Portfolio</h1>
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <form id="create-portfolio-form">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="what-i-enjoy" class="form-label">What I enjoy</label>
                            <input class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="what-ive-tried" class="form-label">What I've Tried</label>
                            <input class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="what-i-currious-about" class="form-label">What I Currious About</label>
                            <input class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Create Portfolio</button>
                    </form>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
